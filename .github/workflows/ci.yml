name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: |
          moon version --all
          node --version
          python3 --version

      - name: Resolve dependencies
        run: moon update

      # 双后端必须都过：wasm-gc 是发布目标，js 是示例与 CLI 的运行环境。
      - name: check (wasm-gc)
        run: moon check --target wasm-gc
      - name: check (js)
        run: moon check --target js
      - name: test (wasm-gc)
        run: moon test --target wasm-gc
      - name: test (js)
        run: moon test --target js

      # 生成器自身依赖参考实现：版本不固定，--check 的结果就没有意义。
      # 用独立 venv 而不是系统 python：ubuntu 的 PEP 668 会拒绝直接 pip install，
      # 且 .venv 放在仓库外，免得被打进发布包。
      - name: Reference toolchain
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install -r requirements-dev.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # 对齐 golden 的参考词表 1.6MB，不入库；按 sha256 校验后下载。
      - name: Reference vocabulary
        run: python3 tools/fetch_vocab.py

      # 生成物与指纹：任何一处漂移都失败（README「开发」一节逐条对应）。
      - name: golden / format lock
        run: |
          python3 tools/gen_unicode.py --check
          python3 tools/gen_sample_vocab.py --check
          python3 tools/gen_pretoken_golden.py --check
          python3 tools/gen_alignment_golden.py --check
          python3 tools/gen_format_lock.py --check

      # 示例的真实输出逐字节比对：报告是规范文本，所以可以当指纹用。
      # 正向（verify ok）与反向（verify 必须报出对不上的两个 sha256）都在这里。
      - name: examples
        run: python3 tools/check_examples.py

      # 校验入口本身也要被 CI 调用，否则"可审计"只是一句口号。
      # 0.6.1 起退出码是契约（成功 0 / 失败 1），这里同时断言退出码与 stdout。
      - name: verify (self-consistency)
        run: |
          out=$(moon run cmd/main --target wasm-gc -- verify \
            --report tests/golden/sample-plan.txt \
            --digest tests/golden/sample-digest.txt)
          test "$out" = "verify ok"
          echo "verify ok: report + digest agree"

      # 反向：不配对的报告与摘要必须让**进程失败**，而不是打印一行错误后仍然 exit 0。
      # 这条用例就是 0.6.0「退出码不是契约」那个问题的回归测试。
      - name: verify (failure exits non-zero)
        run: |
          set -eu
          if moon run cmd/main --target wasm-gc -- verify \
               --report tests/golden/sample-plan.txt \
               --digest tests/golden/sample-digest-overflow.txt; then
            echo "expected verify to fail on a mismatched pair, but it exited 0" >&2
            exit 1
          fi
          echo "mismatched pair: verify exited non-zero as expected"

      # 印记：摘要被密钥认过一次；同一把 key 必须通过，换一把必须失败。
      - name: verify (seal)
        run: |
          set -eu
          tmp=$(mktemp -d)
          printf 'hello world hello world' > "$tmp/payload.txt"
          args="--vocab tests/golden/sample-vocab.txt --limit 30 --reserve 4 --truncate tail --file $tmp/payload.txt"
          moon run cmd/main --target wasm-gc -- fit $args > "$tmp/report.txt"
          moon run cmd/main --target wasm-gc -- digest $args > "$tmp/digest.txt"
          moon run cmd/main --target wasm-gc -- seal \
            --digest "$tmp/digest.txt" --key ci-key --key-id ci > "$tmp/seal.txt"
          moon run cmd/main --target wasm-gc -- verify \
            --report "$tmp/report.txt" --digest "$tmp/digest.txt" \
            --seal "$tmp/seal.txt" --key ci-key
          if moon run cmd/main --target wasm-gc -- verify \
               --report "$tmp/report.txt" --digest "$tmp/digest.txt" \
               --seal "$tmp/seal.txt" --key wrong-key; then
            echo "expected a wrong seal key to fail, but it exited 0" >&2
            exit 1
          fi
          echo "seal: sealed digest verifies, wrong key rejected"

      # 端到端复算：报告与摘要由当次装配重新生成，`verify` 必须逐字节还原两者。
      - name: verify (end-to-end recompute)
        run: |
          set -eu
          tmp=$(mktemp -d)
          printf 'hello world hello world' > "$tmp/payload.txt"
          args="--vocab tests/golden/sample-vocab.txt --limit 30 --reserve 4 --truncate tail --file $tmp/payload.txt"
          moon run cmd/main --target wasm-gc -- fit $args > "$tmp/report.txt"
          moon run cmd/main --target wasm-gc -- digest $args > "$tmp/digest.txt"
          out=$(moon run cmd/main --target wasm-gc -- verify \
            --report "$tmp/report.txt" --digest "$tmp/digest.txt" $args)
          test "$out" = "verify ok"
          echo "recomputed: report $(wc -c < "$tmp/report.txt") bytes, digest $(wc -c < "$tmp/digest.txt") bytes"

      # 1.0 新能力在**发布目标后端**上也要能复算：段 / 池 / 占位压缩三个参数
      # 必须和 fit / digest / verify 走同一条口径，否则"复算通过"只是子命令各自编故事。
      - name: verify (pools + compress, end-to-end)
        run: |
          set -eu
          tmp=$(mktemp -d)
          printf 'you are a coding agent.' > "$tmp/system.txt"
          printf 'read_file(path) -> returns the file content as text' > "$tmp/tools.txt"
          printf 'user: how do i publish this module?\n%.0s' 1 2 3 4 5 6 > "$tmp/history.txt"
          args="--vocab tests/golden/sample-vocab.txt --limit 400 --truncate compress
            --segment system:pinned:$tmp/system.txt
            --segment tools:newest:$tmp/tools.txt
            --segment history:oldest:$tmp/history.txt
            --pool tools=10 --pool history=300
            --segment-pool tools=tools --segment-pool history=history"
          moon run cmd/main --target wasm-gc -- fit $args > "$tmp/report.txt"
          moon run cmd/main --target wasm-gc -- digest $args > "$tmp/digest.txt"
          grep -q '^\[pools\]$' "$tmp/report.txt"
          grep -q '^tools ' "$tmp/report.txt"
          out=$(moon run cmd/main --target wasm-gc -- verify \
            --report "$tmp/report.txt" --digest "$tmp/digest.txt" $args)
          test "$out" = "verify ok"
          echo "pools + compress: recomputed on wasm-gc, pool ledger present"

      # 基准只防退化（不设优化目标）。基线在 Windows 上记录，CI 是 Linux：
      # 同一 OS 比 2x，跨 OS 放到 3x——绝对毫秒跨系统不可紧比，那一刻只抓数量级退化。
      # 用 python3：ubuntu 镜像不保证有 `python`（rest 全部步骤也都是 python3）。
      - name: bench (wasm-gc, regression guard)
        run: python3 tools/check_bench.py

      # 发布包能被打出来（不发布、不需要凭据）。
      - name: package
        run: moon package
